<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة الاختبارات | منظومة التقييم</title>
    <meta name="theme-color" content="#010C0A" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sytest-theme')
          if (theme !== 'light') theme = 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F6F1E4' : '#010C0A')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
    <meta name="description" content="منصة اختبارات احترافية: عام، شفهي، أهلية قيادة الضابط، وتقييم الشخصية" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
